baseURL = "https://apollogeddon.github.io/forgego/"
title = "Forge.go"
locale = "en"
enableGitInfo = false

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup.goldmark.renderer]
  unsafe = false

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs/getting-started"
    weight = 1
  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/apollogeddon/forgego"
    weight = 4
    [menu.main.params]
      icon = "github"

[params]
  tagline = "Quality tooling, zero configuration drift"
  description = "DevOps support and quality control for modern Go projects."

[params.navbar]
  displayTitle = true
  displayLogo = true
  [params.navbar.logo]
    path = "forgego.svg"
    width = "28"
    height = "28"

[params.footer]
  displayPoweredBy = false
  displayCopyright = false

[params.theme]
  default = "dark"
  displayToggle = false
