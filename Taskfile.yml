version: '3'
vars:
  TASK: go tool -modfile=.forgego/task.mod task
  FORGEGO: go run ./cmd/forgego
  LEFTHOOK: go tool -modfile=.forgego/lefthook.mod lefthook
  GOLANGCI_LINT: go tool -modfile=.forgego/golangci-lint.mod golangci-lint
  GOVULNCHECK: go tool -modfile=.forgego/govulncheck.mod govulncheck
  VERSION: dev
  GOTESTSUM: go tool -modfile=.forgego/gotestsum.mod gotestsum
tasks:
  sync:
    desc: Refresh the files forgego manages in .forgego/ and .golangci.yml
    cmds:
      - '{{.FORGEGO}} sync'
  sync-check:
    desc: Fail if a file forgego manages is out of date
    cmds:
      - '{{.FORGEGO}} sync --check'
  hooks:
    desc: Install the git hooks
    cmds:
      - '{{.LEFTHOOK}} install'
  lint:
    desc: Format, then lint and fix what can be fixed
    cmds:
      - '{{.GOLANGCI_LINT}} fmt'
      - '{{.GOLANGCI_LINT}} run --fix'
  format:
    desc: Format the code
    cmds:
      - '{{.GOLANGCI_LINT}} fmt'
  security:
    desc: Report known vulnerabilities the code calls
    cmds:
      - '{{.GOVULNCHECK}} ./...'
  build:
    desc: Build the binary into dist/
    cmds:
      - go build -trimpath -ldflags "-X github.com/apollogeddon/forgego/internal/version.injected={{.VERSION}}" -o dist/forgego{{exeExt}} ./cmd/forgego
  start:
    desc: Run the service
    cmds:
      - go run ./cmd/forgego {{.CLI_ARGS}}
  release:snapshot:
    desc: Build every release binary into dist/ without publishing
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@v2.18.2 release --snapshot --clean
  test:unit:
    desc: Run the unit tests, skipping the integration test that scaffolds real projects
    cmds:
      - go test -short ./...
  generate:
    desc: Copy the pinned tool modules from tools/ into the embedded templates
    cmds:
      - go generate ./...
  test:
    desc: Run the tests with coverage and a JUnit report
    cmds:
      - '{{.GOTESTSUM}} --junitfile junit-report.xml -- -coverprofile=coverage.out -covermode=atomic ./...'
  commit-msg:
    desc: Check a commit message file against Conventional Commits
    cmds:
      - '{{.FORGEGO}} commit-msg {{.CLI_ARGS}}'
