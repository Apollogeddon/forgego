name: Go Website

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      test_on_push:
        description: "Run the checks on pushes too; false runs them on pull requests (and scheduled runs) only"
        required: false
        type: boolean
        default: true
      test_release_prs:
        description: "Run the checks on release-please's release pull requests"
        required: false
        type: boolean
        default: true
      enable_secrets:
        required: false
        type: boolean
        default: true
      go_version:
        description: "Go version; empty reads the project's go.mod, else Go 1.27"
        required: false
        type: string
        default: ''
      working_directory:
        required: false
        type: string
        default: '.'
      enable_versioning:
        required: false
        type: boolean
        default: true
      artifact_name:
        required: false
        type: string
        default: 'dist'
      build_command:
        required: false
        type: string
        default: 'go tool -modfile=.forgego/task/go.mod task build'
      auto_merge:
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run the Go tests; off, as a Hugo site has none"
        required: false
        type: boolean
        default: false
      auto_patch:
        description: "On main, upgrade the modules govulncheck finds vulnerable; off, as a Hugo site has none"
        required: false
        type: boolean
        default: false
      reviewers:
        description: "Comma-separated logins to request a review of Dependabot's and release-please's pull requests from; empty means the repository's owner"
        required: false
        type: string
        default: ''
      base_url:
        description: "The site's baseURL from its Hugo config, e.g. https://owner.github.io/repo/; the site checks serve the build at its path and treat links to it as internal"
        required: false
        type: string
        default: '/'
      check_links:
        description: "Check the built site's links with lychee before it deploys"
        required: false
        type: boolean
        default: false
      link_check_args:
        description: "More lychee arguments; the default --offline checks internal links only, and '' checks external links too"
        required: false
        type: string
        default: '--offline'
      check_accessibility:
        description: "Check the built site's pages with axe before it deploys"
        required: false
        type: boolean
        default: false
      accessibility_paths:
        description: "Pages axe checks, relative to base_url, one per line or space-separated"
        required: false
        type: string
        default: '/'
      accessibility_args:
        description: "More axe CLI arguments, e.g. --tags wcag2a,wcag2aa or --disable color-contrast"
        required: false
        type: string
        default: ''
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ jobs.version.outputs.new_release_published }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.tag_name }}

jobs:
  testing:
    # With test_on_push false, a push checks only when a release is made, in release-testing.
    # Without versioning every push deploys, and only these checks build what it deploys, so they always run.
    if: >-
      (github.event_name != 'push' || inputs.test_on_push || !inputs.enable_versioning) &&
      (inputs.test_release_prs || !startsWith(github.head_ref, 'release-please--'))
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      go_version: ${{ inputs.go_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      lint: false
      run_tests: ${{ inputs.run_tests }}
      auto_patch: ${{ inputs.auto_patch }}
      artifact_name: ${{ inputs.artifact_name }}
      artifact_path: public
      build_command: ${{ inputs.build_command }}

  # Dependabot's pull requests ask for a review as they open, before the checks, so a failing
  # update reaches the reviewer too
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/review.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      reviewers: ${{ inputs.reviewers }}
    permissions:
      pull-requests: write

  auto-merge:
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ inputs.runs_on }}
    needs: [testing, site-checks]
    # the site checks are skipped unless turned on, which mustn't skip the merge
    if: ${{ !failure() && !cancelled() && inputs.auto_merge && needs.testing.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write

  version:
    # Runs when the checks were skipped, as on a push to main with test_on_push false, but not when they failed.
    if: ${{ !failure() && !cancelled() && inputs.enable_versioning }}
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      reviewers: ${{ inputs.reviewers }}

  release-testing:
    # With test_on_push false, a push to main is checked and built only when release-please made a release.
    needs: [version]
    if: >-
      !cancelled() && github.event_name == 'push' && !inputs.test_on_push &&
      (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      go_version: ${{ inputs.go_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      lint: false
      run_tests: ${{ inputs.run_tests }}
      auto_patch: ${{ inputs.auto_patch }}
      artifact_name: ${{ inputs.artifact_name }}
      artifact_path: public
      build_command: ${{ inputs.build_command }}

  # Links and accessibility, checked on the built artifact the deploy ships.
  site-checks:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    needs: [testing, release-testing]
    if: >-
      !failure() && !cancelled() && (inputs.check_links || inputs.check_accessibility) &&
      (needs.testing.result == 'success' || needs['release-testing'].result == 'success')
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/forgego-site
      # the build's links include base_url's path, so the site goes under it in a root of its own
      - name: Place the site at its base path
        id: site
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          case "$BASE_URL" in
            http://*|https://*)
              rest="${BASE_URL#*://}"
              host="${rest%%/*}"
              origin="${BASE_URL%%://*}://$host"
              path="${rest#"$host"}"
              ;;
            *) origin='' path="$BASE_URL" ;;
          esac
          path="/${path#/}"
          path="${path%/}/"
          root="$RUNNER_TEMP/forgego-site-root"
          mkdir -p "$root$path"
          cp -R "$RUNNER_TEMP/forgego-site/." "$root$path"
          args="--no-progress --root-dir $root --index-files index.html"
          if [ -n "$origin" ]; then
            # links to the site's own address are internal: check them in the build
            args="$args --remap '^$(sed 's/[.]/\\./g' <<< "$origin$path") file://$root$path'"
          fi
          {
            echo "root=$root"
            echo "path=$path"
            echo "lychee_args=$args"
          } >> "$GITHUB_OUTPUT"
      - uses: lycheeverse/lychee-action@v2
        if: inputs.check_links
        with:
          args: ${{ steps.site.outputs.lychee_args }} ${{ inputs.link_check_args }} '${{ steps.site.outputs.root }}/**/*.html'
      - uses: actions/setup-node@v7
        if: inputs.check_accessibility
        with:
          node-version: lts/*
      - name: Check accessibility
        if: inputs.check_accessibility
        env:
          ROOT: ${{ steps.site.outputs.root }}
          BASE_PATH: ${{ steps.site.outputs.path }}
          PAGES: ${{ inputs.accessibility_paths }}
          ARGS: ${{ inputs.accessibility_args }}
          # browser-driver-manager installs a matching Chrome and ChromeDriver instead
          CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$ROOT" > /dev/null 2>&1 &
          npx --yes browser-driver-manager@2.0.1 install chrome
          curl -sSf --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null "http://127.0.0.1:4173$BASE_PATH"
          urls=()
          for page in $PAGES; do
            urls+=("http://127.0.0.1:4173$BASE_PATH${page#/}")
          done
          # no-sandbox, as a container runner's Chrome may run as root
          # shellcheck disable=SC2086 # one word per argument
          npx --yes @axe-core/cli@4.13.0 "${urls[@]}" --exit --chrome-options=no-sandbox,disable-dev-shm-usage $ARGS

  deploy:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    needs: [testing, version, release-testing, site-checks]
    # !failure() rather than success(), so a skipped version or checks job doesn't skip the deploy
    if: |
      !failure() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (needs.testing.result == 'success' || needs['release-testing'].result == 'success') &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (!inputs.enable_versioning || needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ./pages-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
