name: Go Quality

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        required: false
        type: string
        default: '.'
      go_version:
        description: "Go version; empty reads the project's go.mod, else Go 1.27"
        required: false
        type: string
        default: ''
      apt_packages:
        description: "apt packages to install before compiling, space-separated, e.g. the C libraries a cgo dependency needs; Ubuntu runners only"
        required: false
        type: string
        default: ''
      enable_secrets:
        required: false
        type: boolean
        default: true
      lint:
        description: "Run golangci-lint; a website has no Go to lint"
        required: false
        type: boolean
        default: true

jobs:
  secure:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks Scan
        if: inputs.enable_secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A high or critical finding (CVSS 7 or more) fails a pull request; on main it's annotated
      # instead, so releases and the patch job that fixes it still run. Accept one with an
      # IgnoredVulns entry in an osv-scanner.toml beside the go.mod
      - name: OSV Scan
        id: osv
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # 0: nothing found, 1: vulnerabilities found, 128: no lockfile, anything else: no scan
          status=0
          "$RUNNER_TEMP/osv-scanner" scan source -r --format json --output-file "$RUNNER_TEMP/osv.json" . || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/osv-scanner"
      - name: Report OSV findings
        uses: actions/github-script@v9
        env:
          OSV_STATUS: ${{ steps.osv.outputs.status }}
          OSV_REPORT: ${{ runner.temp }}/osv.json
          OSV_ENFORCE: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const status = Number(process.env.OSV_STATUS);
            if (status === 128) {
              core.info('No lockfiles to scan');
              return;
            }
            if ((status !== 0 && status !== 1) || !fs.existsSync(process.env.OSV_REPORT)) {
              core.warning(`OSV-Scanner couldn't finish (exit ${status}), so dependencies weren't checked; see the scan step's log`, { title: 'OSV scan incomplete' });
              return;
            }
            const report = JSON.parse(fs.readFileSync(process.env.OSV_REPORT, 'utf8'));
            // a GitHub advisory's rating when an advisory has no CVSS score
            const ratings = { CRITICAL: 9, HIGH: 7, MODERATE: 4, MEDIUM: 4, LOW: 1 };
            const rows = [];
            let blocking = 0;
            for (const result of report.results ?? []) {
              const file = path.relative(process.env.GITHUB_WORKSPACE, result.source.path);
              for (const { package: pkg, vulnerabilities = [], groups = [] } of result.packages ?? []) {
                for (const group of groups) {
                  const vulns = vulnerabilities.filter((v) => group.ids.includes(v.id));
                  let score = Number.parseFloat(group.max_severity);
                  if (Number.isNaN(score)) {
                    score = Math.max(0, ...vulns.map((v) => ratings[String(v.database_specific?.severity).toUpperCase()] ?? 0));
                  }
                  const high = score >= 7;
                  const message = `${pkg.name} ${pkg.version}: ${group.ids.join(', ')} ${vulns[0]?.summary ?? ''} (severity ${score || 'unknown'})`;
                  if (high) {
                    blocking++;
                    core.error(message, { title: 'High or critical vulnerability', file });
                  } else {
                    core.warning(message, { title: 'Vulnerability', file });
                  }
                  rows.push([file, `${pkg.name} ${pkg.version}`, group.ids.join(', '), String(score || 'unknown')]);
                }
              }
            }
            if (rows.length) {
              await core.summary
                .addHeading('OSV-Scanner findings', 3)
                .addTable([['Lockfile', 'Package', 'Advisories', 'Severity'], ...rows])
                .write();
            }
            const found = `${blocking} high or critical ${blocking === 1 ? 'vulnerability' : 'vulnerabilities'}`;
            if (blocking && process.env.OSV_ENFORCE === 'true') {
              core.setFailed(`${found}: update the packages, or record an accepted one in osv-scanner.toml`);
            } else if (blocking) {
              core.warning(`${found}: this fails pull requests until they're updated, as the patch job may do`, { title: 'OSV scan' });
            } else {
              core.info(`${rows.length} found, none high or critical`);
            }
      - name: Install apt packages
        if: inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y --no-install-recommends $PACKAGES
      # the input if set, else the project's go.mod, else forgego's default
      - name: Resolve the Go version
        id: go
        if: hashFiles(format('{0}/.forgego/govulncheck/go.mod', inputs.working_directory)) != ''
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.go_version }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -n "$INPUT" ]; then echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "file=$DIR/go.mod" >> "$GITHUB_OUTPUT"
          else echo "version=1.27" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: hashFiles(format('{0}/.forgego/govulncheck/go.mod', inputs.working_directory)) != ''
        with:
          go-version: ${{ steps.go.outputs.version }}
          go-version-file: ${{ steps.go.outputs.file }}
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/.forgego/*/go.sum
      # Reports only the vulnerabilities the code actually calls. It doesn't fail the
      # checks, as the patch job upgrades the vulnerable modules once they pass on main.
      - name: govulncheck
        if: hashFiles(format('{0}/.forgego/govulncheck/go.mod', inputs.working_directory)) != ''
        run: |
          go tool -modfile=.forgego/govulncheck/go.mod govulncheck ./... ||
            echo "::warning::govulncheck found vulnerabilities the code calls; the patch job upgrades them on main"

  linting:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install apt packages
        if: inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y --no-install-recommends $PACKAGES
      # the input if set, else the project's go.mod, else forgego's default
      - name: Resolve the Go version
        id: go
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.go_version }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -n "$INPUT" ]; then echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "file=$DIR/go.mod" >> "$GITHUB_OUTPUT"
          else echo "version=1.27" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          go-version-file: ${{ steps.go.outputs.file }}
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/.forgego/*/go.sum
      - name: Check forgego's files are current
        if: hashFiles(format('{0}/.forgego/task/go.mod', inputs.working_directory)) != '' && github.actor != 'dependabot[bot]'
        run: go tool -modfile=.forgego/task/go.mod task sync-check
      # a Dependabot bump of forgego changes the files it manages: lint against them
      # refreshed, and the testing workflow's patch job commits them once the bump merges
      - name: Refresh forgego's files
        if: hashFiles(format('{0}/.forgego/task/go.mod', inputs.working_directory)) != '' && github.actor == 'dependabot[bot]'
        run: go tool -modfile=.forgego/task/go.mod task sync
      # a Hugo site's go.mod holds its theme, which no Go code imports, so tidy would drop it
      - name: Check go.mod is tidy
        if: inputs.lint
        run: go mod tidy -diff
      - name: Format Check
        if: inputs.lint
        run: go tool -modfile=.forgego/golangci-lint/go.mod golangci-lint fmt --diff
      - name: golangci-lint
        if: inputs.lint
        run: go tool -modfile=.forgego/golangci-lint/go.mod golangci-lint run
