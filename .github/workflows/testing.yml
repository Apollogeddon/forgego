name: Go Tests

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        required: false
        type: string
        default: '.'
      go_version:
        description: "Go version; empty reads the project's go.mod, else Go 1.27"
        required: false
        type: string
        default: ''
      apt_packages:
        description: "apt packages to install before compiling, space-separated, e.g. the C libraries a cgo dependency needs; Ubuntu runners only"
        required: false
        type: string
        default: ''
      enable_secrets:
        required: false
        type: boolean
        default: true
      lint:
        description: "Run golangci-lint; a website has no Go to lint"
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true
      auto_patch:
        description: "On main, upgrade the modules govulncheck finds vulnerable and commit the result"
        required: false
        type: boolean
        default: true
      artifact_name:
        required: false
        type: string
        default: 'dist'
      artifact_path:
        description: "What the build writes, relative to working_directory"
        required: false
        type: string
        default: 'dist'
      build_command:
        required: false
        type: string
        default: 'go tool -modfile=.forgego/task/go.mod task build'
      extra_runners:
        description: 'JSON list of more runners to test and build on, each a label or {"runs_on", "name", "env"}, e.g. ["macos-latest", {"runs_on": "windows-latest", "env": {"CGO_ENABLED": "0"}}]'
        required: false
        type: string
        default: '[]'
      extra_test_task:
        description: "The Task task the extra runners test with, e.g. a shorter test:short"
        required: false
        type: string
        default: 'test'
      setup_script:
        description: "A script, relative to working_directory, run with bash before compiling on the extra runners and native builds; RUNNER_OS says where, and it can export through GITHUB_ENV and GITHUB_PATH"
        required: false
        type: string
        default: ''

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      go_version: ${{ inputs.go_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      lint: ${{ inputs.lint }}
      apt_packages: ${{ inputs.apt_packages }}

  testing:
    runs-on: ${{ inputs.runs_on }}
    if: inputs.run_tests
    timeout-minutes: 15
    needs: [quality]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install apt packages
        if: inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y --no-install-recommends $PACKAGES
      # the input if set, else the project's go.mod, else forgego's default
      - name: Resolve the Go version
        id: go
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.go_version }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -n "$INPUT" ]; then echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "file=$DIR/go.mod" >> "$GITHUB_OUTPUT"
          else echo "version=1.27" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          go-version-file: ${{ steps.go.outputs.file }}
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/.forgego/*/go.sum
      - name: Tests
        # the race detector needs cgo, which GitHub's Ubuntu runners have
        env:
          GOFLAGS: -race
        run: go tool -modfile=.forgego/task/go.mod task test
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.artifact_name }}
          path: |
            ${{ inputs.working_directory }}/coverage.out
            ${{ inputs.working_directory }}/junit-report.xml
          if-no-files-found: ignore

  build:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    # only needs the checks to pass, so it runs alongside the tests
    needs: [quality]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install apt packages
        if: inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y --no-install-recommends $PACKAGES
      # the input if set, else the project's go.mod, else forgego's default
      - name: Resolve the Go version
        id: go
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.go_version }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -n "$INPUT" ]; then echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "file=$DIR/go.mod" >> "$GITHUB_OUTPUT"
          else echo "version=1.27" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          go-version-file: ${{ steps.go.outputs.file }}
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/.forgego/*/go.sum
      - name: Build
        run: ${{ inputs.build_command }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/${{ inputs.artifact_path }}
          if-no-files-found: ignore

  # The tests and the build on each extra runner, such as macOS or Windows. An entry is a runner
  # label, or an object whose env is set for both, so a test runs the build it ships with.
  extra:
    # an empty matrix fails the workflow, so the job is skipped instead
    if: inputs.extra_runners != '' && inputs.extra_runners != '[]'
    runs-on: ${{ matrix.target.runs_on || matrix.target }}
    timeout-minutes: 30
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.extra_runners) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install apt packages
        if: runner.os == 'Linux' && inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y --no-install-recommends $PACKAGES
      # the input if set, else the project's go.mod, else forgego's default
      - name: Resolve the Go version
        id: go
        env:
          INPUT: ${{ inputs.go_version }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -n "$INPUT" ]; then echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "file=$DIR/go.mod" >> "$GITHUB_OUTPUT"
          else echo "version=1.27" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          go-version-file: ${{ steps.go.outputs.file }}
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/.forgego/*/go.sum
      - name: Set the entry's environment
        if: matrix.target.env
        env:
          TARGET_ENV: ${{ toJSON(matrix.target.env) }}
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$TARGET_ENV" >> "$GITHUB_ENV"
      - name: Setup script
        if: inputs.setup_script != ''
        env:
          SCRIPT: ${{ inputs.setup_script }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$SCRIPT"
      - name: Tests
        if: inputs.run_tests
        env:
          TASK: ${{ inputs.extra_test_task }}
        # the race detector needs cgo, so it's on wherever cgo is
        run: |
          if [ "$(go env CGO_ENABLED)" = "1" ]; then export GOFLAGS="${GOFLAGS:+$GOFLAGS }-race"; fi
          go tool -modfile=.forgego/task/go.mod task "$TASK"
      - name: Build
        run: ${{ inputs.build_command }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.target.name || matrix.target.runs_on || matrix.target }}
          path: ${{ inputs.working_directory }}/${{ inputs.artifact_path }}
          if-no-files-found: ignore

  patch:
    if: ${{ !failure() && !cancelled() && inputs.auto_patch && github.ref == 'refs/heads/main' }}
    needs: [quality, testing, build, extra]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # keeps the token in .git/config, as this job pushes the patch commit
      - uses: actions/checkout@v7
      - name: Install apt packages
        if: inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y --no-install-recommends $PACKAGES
      # the input if set, else the project's go.mod, else forgego's default
      - name: Resolve the Go version
        id: go
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.go_version }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -n "$INPUT" ]; then echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "file=$DIR/go.mod" >> "$GITHUB_OUTPUT"
          else echo "version=1.27" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          go-version-file: ${{ steps.go.outputs.file }}
          # no module cache in a job that pushes to main
          cache: false
      # a Dependabot bump of forgego leaves the files it manages for this job to refresh
      - name: Refresh forgego's files
        if: hashFiles(format('{0}/.forgego/task/go.mod', inputs.working_directory)) != ''
        run: go tool -modfile=.forgego/task/go.mod task sync
      # sync is the only change in this checkout so far, and which files it touches varies
      - name: Commit forgego's files
        if: hashFiles(format('{0}/.forgego/task/go.mod', inputs.working_directory)) != ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(deps): refresh the files forgego manages"
          repository: ${{ inputs.working_directory }}
      # govulncheck names the fixed version of each vulnerable module, so this upgrades
      # just those. The standard library is fixed by a newer Go, not by go get.
      - name: Upgrade vulnerable modules
        run: |
          go tool -modfile=.forgego/govulncheck/go.mod govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck.json"
          mapfile -t upgrades < <(jq -r '
            select((.finding.fixed_version // "") != "")
            | .finding
            | select(.trace[0].module != "stdlib")
            | "\(.trace[0].module)@\(.fixed_version)"' "$RUNNER_TEMP/govulncheck.json" | sort -u)
          if [ "${#upgrades[@]}" -eq 0 ]; then exit 0; fi
          go get "${upgrades[@]}"
          go mod tidy
      - name: Commit Security Patches
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix(deps): upgrade modules with known vulnerabilities via govulncheck"
          file_pattern: 'go.mod go.sum'
