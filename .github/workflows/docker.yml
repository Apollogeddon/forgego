name: docker

# Builds a multi-platform image; with push, builds it again from scratch and pushes it to GitHub Container Registry.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      platforms:
        description: "Comma-separated target platforms, e.g. linux/amd64,linux/arm64,linux/arm/v7"
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: "Build and push to the registry in the push stage; otherwise the build stage builds only, which checks the Dockerfile"
        required: false
        type: boolean
        default: false
      version:
        description: "Release version used for semver tags"
        required: false
        type: string
        default: ''
      image:
        description: "Image name; defaults to ghcr.io/<owner>/<repo>"
        required: false
        type: string
        default: ''
      working_directory:
        description: "Directory holding the Dockerfile and the build context"
        required: false
        type: string
        default: '.'
      buildkit_endpoint:
        description: "A remote BuildKit (e.g. tcp://runner.builder:1234) for runners without a Docker daemon; empty uses the runner's own"
        required: false
        type: string
        default: ''
      dockerfile:
        description: "The Dockerfile, relative to working_directory; empty means its Dockerfile"
        required: false
        type: string
        default: ''
      qemu:
        description: "Emulate other platforms with QEMU, for a Dockerfile that compiles in each platform's own image (the runner's own Docker only)"
        required: false
        type: boolean
        default: false
      build_args:
        description: "More build arguments, one NAME=value per line, beside VERSION"
        required: false
        type: string
        default: ''
      tags:
        description: "docker/metadata-action tag rules, one per line, in place of the default tags"
        required: false
        type: string
        default: ''


# The generated Dockerfiles cross-compile on the build host, and their runtime stages run nothing, so
# one job builds every platform without emulation; qemu is for a Dockerfile that doesn't.

# every job asks for what it needs
permissions: {}

jobs:
  # the image, unpushed, so a pull request checks the Dockerfile
  build:
    name: build
    if: ${{ !inputs.push }}
    runs-on: ${{ inputs.runs_on }}
    # emulated builds are many times slower
    timeout-minutes: ${{ inputs.qemu && 90 || 30 }}
    permissions:
      contents: read
    env:
      DEFAULT_TAGS: |
        type=semver,pattern={{version}},value=${{ inputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
        type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ !startsWith(inputs.version, '0.') }}
        type=sha
        type=raw,value=latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: echo "image=$(echo "${IMAGE:-ghcr.io/$REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # a remote BuildKit brings its own emulation, if any
      - name: Set up QEMU
        if: inputs.qemu && inputs.buildkit_endpoint == ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        if: inputs.buildkit_endpoint == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Use the remote BuildKit
        if: inputs.buildkit_endpoint != ''
        env:
          ENDPOINT: ${{ inputs.buildkit_endpoint }}
        run: docker buildx create --name forgego --driver remote "$ENDPOINT" --use
      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          tags: ${{ inputs.tags || env.DEFAULT_TAGS }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working_directory }}
          file: ${{ inputs.dockerfile != '' && format('{0}/{1}', inputs.working_directory, inputs.dockerfile) || '' }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            VERSION=${{ inputs.version || 'dev' }}
            ${{ inputs.build_args }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # a release's image, tagged and pushed
  push:
    name: push
    if: inputs.push
    runs-on: ${{ inputs.runs_on }}
    # emulated builds are many times slower
    timeout-minutes: ${{ inputs.qemu && 90 || 30 }}
    permissions:
      contents: read
      packages: write
    env:
      DEFAULT_TAGS: |
        type=semver,pattern={{version}},value=${{ inputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
        type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ !startsWith(inputs.version, '0.') }}
        type=sha
        type=raw,value=latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: echo "image=$(echo "${IMAGE:-ghcr.io/$REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Without a Docker daemon there's no docker login, so write the credentials buildx reads instead.
      - name: Write the registry credentials
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$ACTOR" "$TOKEN" | base64 -w0)" > ~/.docker/config.json
      # a remote BuildKit brings its own emulation, if any
      - name: Set up QEMU
        if: inputs.qemu && inputs.buildkit_endpoint == ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        if: inputs.buildkit_endpoint == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Use the remote BuildKit
        if: inputs.buildkit_endpoint != ''
        env:
          ENDPOINT: ${{ inputs.buildkit_endpoint }}
        run: docker buildx create --name forgego --driver remote "$ENDPOINT" --use
      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          tags: ${{ inputs.tags || env.DEFAULT_TAGS }}
      # A pushed image builds without a cache, which another repository's job could have planted layers in.
      - name: Push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working_directory }}
          file: ${{ inputs.dockerfile != '' && format('{0}/{1}', inputs.working_directory, inputs.dockerfile) || '' }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            VERSION=${{ inputs.version || 'dev' }}
            ${{ inputs.build_args }}
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Forget the credentials
        if: always()
        run: rm -f ~/.docker/config.json
