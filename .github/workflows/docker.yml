name: Docker Image

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      platforms:
        description: "Comma-separated target platforms, e.g. linux/amd64,linux/arm64,linux/arm/v7"
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: "Push to the registry; otherwise build only (validates the Dockerfile on PRs)"
        required: false
        type: boolean
        default: false
      version:
        description: "Release version used for semver tags"
        required: false
        type: string
        default: ''
      image:
        description: "Image name; defaults to ghcr.io/<owner>/<repo>"
        required: false
        type: string
        default: ''
      working_directory:
        required: false
        type: string
        default: '.'
      buildkit_endpoint:
        description: "A remote BuildKit (e.g. tcp://runner.builder:1234) for runners without a Docker daemon; empty uses the runner's own"
        required: false
        type: string
        default: ''

# Jobs inherit the calling job's token, which needs packages: write to push.

jobs:
  # The Dockerfiles cross-compile on the build host, and their runtime stages run nothing,
  # so one job builds every platform without emulation.
  build:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: echo "image=$(echo "${IMAGE:-ghcr.io/$REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Without a Docker daemon there's no docker login, so write the credentials buildx reads instead.
      - name: Registry credentials
        if: inputs.push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$ACTOR" "$TOKEN" | base64 -w0)" > ~/.docker/config.json
      - uses: docker/setup-buildx-action@v4
        if: inputs.buildkit_endpoint == ''
      - name: Use the remote BuildKit
        if: inputs.buildkit_endpoint != ''
        env:
          ENDPOINT: ${{ inputs.buildkit_endpoint }}
        run: docker buildx create --name forgego --driver remote "$ENDPOINT" --use

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ !startsWith(inputs.version, '0.') }}
            type=sha
            type=raw,value=latest

      # Pushed images build without a cache, which another repository's job could have planted layers in.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.working_directory }}
          platforms: ${{ inputs.platforms }}
          build-args: VERSION=${{ inputs.version || 'dev' }}
          push: ${{ inputs.push }}
          no-cache: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          cache-from: ${{ !inputs.push && 'type=gha' || '' }}
          cache-to: ${{ !inputs.push && 'type=gha,mode=max' || '' }}
