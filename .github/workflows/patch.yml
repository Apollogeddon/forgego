name: patch

# Weekly or on a manual run: refreshes the files forgego manages and proposes them through a pull request.
# Vulnerable modules are left to Dependabot security updates, which open pull requests of their own.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding go.mod"
        required: false
        type: string
        default: '.'
      go_version:
        description: "Go version; empty reads the project's go.mod, else Go 1.27"
        required: false
        type: string
        default: ''
      apt_packages:
        description: "apt packages to install before compiling, space-separated, e.g. the C libraries a cgo dependency needs; Ubuntu runners only"
        required: false
        type: string
        default: ''

jobs:
  update:
    name: update
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # the branch's tip rather than the triggering commit; the token is handed to the push alone
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Install apt packages
        if: inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y --no-install-recommends $PACKAGES
      # the input if set, else the project's go.mod, else forgego's default
      - name: Resolve the Go version
        id: go
        env:
          INPUT: ${{ inputs.go_version }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -n "$INPUT" ]; then echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "file=$DIR/go.mod" >> "$GITHUB_OUTPUT"
          else echo "version=1.27" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          go-version-file: ${{ steps.go.outputs.file }}
          # no module cache in a job that pushes
          cache: false
      # a Dependabot bump of forgego leaves the files it manages for this job to refresh
      - name: Refresh forgego's files
        if: hashFiles(format('{0}/.forgego/task/go.mod', inputs.working_directory)) != ''
        run: go tool -modfile=.forgego/task/go.mod task sync
      # to a branch of its own rather than main, which a branch protection rule may guard; each module of a
      # monorepo gets its own branch
      - name: Push forgego's files
        id: push
        if: hashFiles(format('{0}/.forgego/task/go.mod', inputs.working_directory)) != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -z "$(git status --porcelain -- .)" ]; then
            echo "forgego's files are current"
            exit 0
          fi
          branch=forgego/sync
          if [ "$DIR" != . ]; then branch="forgego/sync-$(printf '%s' "${DIR#./}" | tr '/' '-')"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          git commit -q -m "chore(deps): refresh the files forgego manages"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open a pull request
        if: steps.push.outputs.branch != ''
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          BASE: ${{ github.ref_name }}
        with:
          script: |
            const { BRANCH: head, BASE: base } = process.env;
            const { data: open } = await github.rest.pulls.list({ ...context.repo, head: `${context.repo.owner}:${head}`, base, state: 'open' });
            if (open.length) return core.info(`#${open[0].number} already proposes ${head}, now updated`);
            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              head,
              base,
              title: 'chore(deps): refresh the files forgego manages',
              // a pull request opened with GITHUB_TOKEN starts no workflow
              body: 'The files `forgego sync` manages, refreshed after a forgego update.\n\nOpened with `GITHUB_TOKEN`, so its checks don\'t start on their own: close and reopen it to run them.',
            });
            core.info(`Opened #${pr.number}`);
