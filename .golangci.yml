# Generated by forgego from .forgego/golangci.yml and .golangci.local.yml.
# Don't edit it: change .golangci.local.yml, then run `task sync`.
version: "2"
run:
  timeout: 5m
linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
